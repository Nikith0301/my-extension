<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Key-Value Storage</title>
  <style>
    body { font-family: system-ui; width: 320px; padding: 10px; }
    input, textarea { width: 100%; padding: 8px; margin-top: 5px; }
    button { margin-top: 8px; padding: 8px; width: 100%; cursor: pointer; }
    
    .item {
      margin-top: 10px; padding: 10px;
      background: #f4f4f4; border-radius: 6px;
    }

    .row {
      display: flex; justify-content: space-between; align-items: center;
    }

    .copy-btn { padding: 5px 10px; }
    .del-btn { padding: 5px 10px; background: #ffcccc; }
  </style>
</head>

<body>
<h3>Store Key → Value</h3>

<input id="keyInput" placeholder="Enter key (e.g., v6999388_P3G1)" />
<textarea id="valueInput" placeholder="Enter long value"></textarea>

<button id="saveBtn">Save</button>

<h3>Stored Keys</h3>
<div id="kvList"></div>

<script src="popup.js"></script>
</body>
</html>
